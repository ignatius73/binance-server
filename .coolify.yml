# Coolify Configuration
# https://coolify.io/docs/

# Service configuration
services:
  - name: binance-signature-server
    dockerfile: Dockerfile
    port: 3333
    healthcheck:
      path: /health
      port: 3333
      interval: 30s
      timeout: 10s
      retries: 3

    # Environment variables (optional)
    environment:
      NODE_ENV: production
      PORT: 3333
      HOST: 0.0.0.0

    # Resource limits (optional)
    resources:
      limits:
        memory: 256Mi
        cpu: 0.5
      requests:
        memory: 128Mi
        cpu: 0.25

# Deployment settings
deployment:
  restartPolicy: always
  strategy: rolling
